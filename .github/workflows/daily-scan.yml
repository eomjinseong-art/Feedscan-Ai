name: Daily Shorts Scan

on:
  schedule:
    - cron: '0 22 * * *'
    - cron: '0 3 * * *'
    - cron: '0 8 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install google-api-python-client openai
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - run: python scripts/generate_tts_script.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      - run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add public/data/ public/tts/
          git diff --staged --quiet || git commit -m "scan: $(date +%Y-%m-%dT%H:%M)"
          git push
